<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Professional barber digital profile">
  <title>BARBER NAME — Barber</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <header class="brand">
      <div class="logo" id="logo">BN</div>
      <div>
        <h1 id="barberName">BARBER NAME</h1>
        <p>Barber & Hair Stylist</p>
      </div>
    </header>

    <section class="hero">
      <img id="barberPhoto" src="https://images.unsplash.com/photo-1622288432450-277d0fef5ed6?auto=format&fit=crop&w=1200&q=85" alt="Barber">
    </section>

    <section class="status-section">
      <div class="status-badge" id="statusBadge">
        <span class="status-dot"></span>
        <span id="statusText">OPEN</span>
      </div>
      <p id="statusNote">Open today · 09:00 — 20:00</p>
    </section>

    <section class="section">
      <div class="section-title">WORKING HOURS</div>
      <div class="hours">
        <div><span>Monday — Saturday</span><strong>09:00 — 20:00</strong></div>
        <div><span>Sunday</span><strong>Closed</strong></div>
      </div>
    </section>

    <section class="section">
      <div class="section-title">PRICES</div>
      <div class="prices">
        <div><span>Haircut</span><strong>15 DT</strong></div>
        <div><span>Beard</span><strong>10 DT</strong></div>
        <div><span>Haircut + Beard</span><strong>20 DT</strong></div>
        <div><span>Kids Haircut</span><strong>12 DT</strong></div>
      </div>
    </section>

    <section class="actions">
      <a class="action whatsapp" id="whatsappBtn" href="https://wa.me/21612345678" target="_blank" rel="noopener">
        <span>WhatsApp</span><span>↗</span>
      </a>
      <a class="action instagram" id="instagramBtn" href="https://instagram.com/" target="_blank" rel="noopener">
        <span>Instagram</span><span>↗</span>
      </a>
      <a class="action location" id="locationBtn" href="https://maps.google.com/?q=Paris%20Barber%20Shop" target="_blank" rel="noopener">
        <span>📍 Location</span><span>↗</span>
      </a>
    </section>

    <footer>
      <span>Digital profile</span>
      <span>•</span>
      <span id="year"></span>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
